aid: airna
name: AIRNA
description: 'AIRNA Corporation is a clinical-stage biotechnology company developing
  precision RNA editing therapeutics based on ADAR (adenosine deaminase acting on RNA),
  a naturally occurring human protein the company redirects to convert adenosine to
  inosine at a targeted RNA site — changing protein function without permanently altering
  DNA. Its oligonucleotide medicines are designed for durable, reversible and repeatable
  dosing. The lead program, AIR-001, targets alpha-1 antitrypsin deficiency (AATD),
  alongside cardiometabolic RNA editing programs spanning rare genetic disorders and
  common conditions. Founded by scientific pioneers of ADAR editing, AIRNA operates
  from Cambridge, Massachusetts and Tübingen, Germany (AIRNA Bio Germany GmbH). AIRNA
  publishes no public API, developer portal, SDK, or machine-readable specification;
  therapeutics, not software, are the product.'
